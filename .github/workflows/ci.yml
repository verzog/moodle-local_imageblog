name: moodle-ci

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

# For the upgrade job below; the shared workflow sets the same time zone itself.
env:
  TZ: Australia/Sydney

concurrency:
  group: moodle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: verzog/moodle-ci-workflows/.github/workflows/moodle-plugin-ci.yml@v1
    with:
      # The plugin declares $plugin->supported = [501, 503], so the stable branches for Moodle 5.1 through 5.3 are
      # all exercised on every PHP and database. MOODLE_500_STABLE is deliberately excluded: it is below the 5.1
      # baseline in version.php. Moodle main is the next version: the shared workflow reports it but lets it fail.
      # Moodle 5.2+ requires PHP 8.3 or newer.
      matrix: >-
        [
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.2", "database": "pgsql"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.2", "database": "mysqli"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.2", "database": "mariadb"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.3", "database": "pgsql"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.3", "database": "mysqli"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.3", "database": "mariadb"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.4", "database": "pgsql"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.4", "database": "mysqli"},
          {"moodle-branch": "MOODLE_501_STABLE", "php": "8.4", "database": "mariadb"},
          {"moodle-branch": "MOODLE_502_STABLE", "php": "8.3", "database": "pgsql"},
          {"moodle-branch": "MOODLE_502_STABLE", "php": "8.3", "database": "mysqli"},
          {"moodle-branch": "MOODLE_502_STABLE", "php": "8.3", "database": "mariadb"},
          {"moodle-branch": "MOODLE_502_STABLE", "php": "8.4", "database": "pgsql"},
          {"moodle-branch": "MOODLE_502_STABLE", "php": "8.4", "database": "mysqli"},
          {"moodle-branch": "MOODLE_502_STABLE", "php": "8.4", "database": "mariadb"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.3", "database": "pgsql"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.3", "database": "mysqli"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.3", "database": "mariadb"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.4", "database": "pgsql"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.4", "database": "mysqli"},
          {"moodle-branch": "MOODLE_503_STABLE", "php": "8.4", "database": "mariadb"},
          {"moodle-branch": "main", "php": "8.4", "database": "pgsql"}
        ]
      grunt-branch: MOODLE_501_STABLE
      # Mess Detector findings fail the build in this plugin.
      phpmd-blocking: true

  # Fresh installs load db/install.xml and never run db/upgrade.php, so the
  # matrix above cannot catch upgrade-path regressions (e.g. an XMLDB builder
  # collision only raised when a table is created programmatically during an
  # upgrade). This job installs the earliest released tag, then swaps in the
  # current code and runs the CLI upgrade, across all three database engines.
  upgrade:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mysql:
        image: mysql:8.4.3
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "true"
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 30s

    strategy:
      fail-fast: false
      matrix:
        database: ['pgsql', 'mysqli', 'mariadb']

    env:
      # Baseline is the earliest published tag; upgrading it to HEAD exercises
      # the whole db/upgrade.php chain (taxonomy restructure + evaluate tables).
      # Pinned to Moodle 5.1, the lowest supported branch; the upgrade SQL itself
      # is Moodle-version independent, and the three DB engines are what matter.
      BASELINE_TAG: v0.5.5
      MOODLE_BRANCH: MOODLE_501_STABLE
      DB: ${{ matrix.database }}
      # moodle-plugin-ci installs Moodle into ./moodle relative to the job's
      # working directory (the workspace) and does not export its path, so set
      # it explicitly for the swap/upgrade steps below.
      MOODLE_DIR: ${{ github.workspace }}/moodle
      # From Moodle 5.1 plugins live under the public/ docroot; the CLI scripts stay in admin/cli at the root.
      PLUGIN_DIR: ${{ github.workspace }}/moodle/public/local/imageblog

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0
          persist-credentials: false

      - name: Record the current (HEAD) commit
        run: |
          echo "HEAD_SHA=$(git -C plugin rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          attempts=0
          until composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4; do
            attempts=$((attempts + 1))
            if [ $attempts -ge 3 ]; then
              echo "composer create-project failed after $attempts attempts" >&2
              exit 1
            fi
            echo "composer create-project attempt $attempts failed, retrying..."
            rm -rf ci
            sleep $((attempts * 5))
          done
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Check out the baseline release
        run: git -C plugin checkout --detach "$BASELINE_TAG"

      - name: Install Moodle with the baseline plugin
        id: install
        run: |
          case "$DB" in
            pgsql)   DBPORT=5432 ;;
            mariadb) DBPORT=3307 ;;
            *)       DBPORT=3306 ;;
          esac
          attempts=0
          until moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-port="$DBPORT"; do
            attempts=$((attempts + 1))
            if [ $attempts -ge 3 ]; then
              echo "moodle-plugin-ci install failed after $attempts attempts" >&2
              exit 1
            fi
            echo "moodle-plugin-ci install attempt $attempts failed, retrying..."
            sleep $((attempts * 10))
          done

      - name: Install the baseline site database
        if: ${{ steps.install.conclusion == 'success' }}
        run: |
          # moodle-plugin-ci only initialises the PHPUnit/Behat test databases,
          # not a real site install, so admin/cli/upgrade.php has no recorded
          # version to upgrade from. Install the main site at the baseline
          # version here; the swap + upgrade below then exercise db/upgrade.php.
          php "$MOODLE_DIR/admin/cli/install_database.php" \
            --agree-license \
            --adminpass='Ci!Passw0rd' \
            --adminemail='admin@example.com' \
            --fullname='CI Upgrade Test' \
            --shortname='ci'

      - name: Swap in the current plugin code
        if: ${{ steps.install.conclusion == 'success' }}
        run: |
          if [ -z "$PLUGIN_DIR" ] || [ ! -d "$PLUGIN_DIR" ]; then
            echo "Plugin not installed at PLUGIN_DIR='$PLUGIN_DIR'" >&2
            exit 1
          fi
          git -C plugin checkout --detach "$HEAD_SHA"
          rsync -a --delete --exclude='.git' ./plugin/ "$PLUGIN_DIR/"

      - name: Run the upgrade
        if: ${{ steps.install.conclusion == 'success' }}
        run: php "$MOODLE_DIR/admin/cli/upgrade.php" --non-interactive
